# Ablation control arm: the shipped full_2b recipe at the reduced budget every
# arm shares. Its numbers sit below the full run's because it trains for 400
# optimizer steps instead of 2,464. That is the point. An arm is only
# interpretable against a control trained the same length, on the same data in
# the same order, and scored on the same split.
#
# Scored on val, never test. Choosing anything on the test split would
# contaminate the number the README reports.
backbone_id: Qwen/Qwen2-VL-2B-Instruct
sam2_id: facebook/sam2.1-hiera-small
load_in_4bit: false
dtype: bfloat16
lora: true
lora_settings:
  r: 16
  alpha: 32

train_jsonl: data/processed/annotations/voxae_reason.jsonl
data_root: data
split: train

# max_steps counts micro-batches and overrides epochs, so every arm sees the
# same first 800 samples of the same shuffled order. Warmup is 10% of the 400
# optimizer steps, scaled up from the full run's 4% because a short run spends
# proportionally longer getting off the ground.
batch_size: 1
grad_accum: 2
max_steps: 800
lr: 2.0e-4
warmup_steps: 40
max_length: 512
seed: 0

ce_weight: 1.0
bce_weight: 2.0
dice_weight: 2.0
train_mask_decoder: true
projector_layers: 2
supervise_text: true

output_dir: outputs/ablations/base
log_every: 25
save_every: 400
